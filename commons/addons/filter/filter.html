<div id="advancedFilter" class="advancedFilter form-group">
  <div class="form-check filter-legend">
    <h2 class="filter__header">
      <span id="filterTitle" class="textlabel">
        Filtre
      </span>
      <div>
        <span id="advancedFilter-clearAll" class="textlabel btnFilter__header" data-toggle="filter-tooltip" data-original-title="Réinitaliser l'ensemble des filtres" onclick="filterUndefined.active(this.id);">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M5.46257 4.43262C7.21556 2.91688 9.5007 2 12 2C17.5228 2 22 6.47715 22 12C22 14.1361 21.3302 16.1158 20.1892 17.7406L17 12H20C20 7.58172 16.4183 4 12 4C9.84982 4 7.89777 4.84827 6.46023 6.22842L5.46257 4.43262ZM18.5374 19.5674C16.7844 21.0831 14.4993 22 12 22C6.47715 22 2 17.5228 2 12C2 9.86386 2.66979 7.88416 3.8108 6.25944L7 12H4C4 16.4183 7.58172 20 12 20C14.1502 20 16.1022 19.1517 17.5398 17.7716L18.5374 19.5674Z"></path></svg>
        </span>
        <span id="advancedFilter-closeAll" class="textlabel btnFilter__header" data-toggle="filter-tooltip" data-original-title="Fermer la fenêtre" onclick="filter.toggle();">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10.5859 12L2.79297 4.20706L4.20718 2.79285L12.0001 10.5857L19.793 2.79285L21.2072 4.20706L13.4143 12L21.2072 19.7928L19.793 21.2071L12.0001 13.4142L4.20718 21.2071L2.79297 19.7928L10.5859 12Z"></path></svg>
        </span>
      </div>
    </h2>
  </div>
  <div id="selectLayerFilter"></div>
  <div id="switchLayerFilter">
    <span>Chantier non renseigné</span>
    <label class="switch">
      <input type="checkbox">
      <span class="slider round" onclick="filterUndefined.active();"></span>
    </label>
  </div>
</div>

<style>
  #switchLayerFilter {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 32px;
    height: 18px;
    margin: 0;
  }

  .switch input { 
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    -webkit-transition: .4s;
    transition: .4s;
  }

  .slider:before {
    position: absolute;
    content: "";
    height: 12px;
    width: 12px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    -webkit-transition: .4s;
    transition: .4s;
  }

  input:checked + .slider {
    background-color: #002ddC;
  }

  input:focus + .slider {
    box-shadow: 0 0 1px #002ddC;
  }

  input:checked + .slider:before {
    -webkit-transform: translateX(14px);
    -ms-transform: translateX(14px);
    transform: translateX(14px);
  }

  /* Rounded sliders */
  .slider.round {
    border-radius: 34px;
  }

  .slider.round:before {
    border-radius: 50%;
  }
</style>
